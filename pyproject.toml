[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docqa-corpus-kit"
version = "0.2.1"
description = "Russian document-QA fixtures, evidence annotations and deterministic mutation generators"
requires-python = ">=3.10"
license = {text = "MIT (code and synthetic content); public sources retain their own rights"}
authors = [{name = "DocQA Corpus Contributors"}]
dependencies = []

[project.optional-dependencies]
service = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "celery[redis]>=5.5,<6", "redis>=5,<7", "python-multipart>=0.0.20,<1"]
rag = ["qdrant-client==1.17.0", "pydantic>=2.11,<3", "langchain-openai>=1,<2", "langchain-text-splitters>=1,<2", "pymupdf>=1.26,<2", "httpx>=0.28,<1", "python-dotenv>=1,<2", "tiktoken>=0.12,<1", "transformers==4.51.3", "jinja2>=3.1,<4"]
notebook = ["nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
pdf = ["reportlab>=4.4,<5", "pypdf>=5.9,<7"]
fixtures = ["reportlab>=4.4,<5", "pypdf>=5.9,<7", "pypdfium2>=4.30,<6", "Pillow>=10,<13"]
dev = ["pytest>=8,<10"]
all = ["reportlab>=4.4,<5", "pypdf>=5.9,<7", "pypdfium2>=4.30,<6", "Pillow>=10,<13", "pytest>=8,<10"]

[project.scripts]
docqa-corpus = "docqa_corpus.cli:main"
docqa-rag = "docqa_rag.cli:main"

[tool.setuptools.packages.find]
include = ["docqa_corpus*", "docqa_rag*", "docqa_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

<svg xmlns="http://www.w3.org/2000/svg" width="1104" height="325" viewBox="0 0 1104 325" role="img" aria-labelledby="title desc">
<title id="title">От документа к ответу</title><desc id="desc">TXT, два поиска, отбор и привязка ответа к исходному тексту.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8392a4"/></marker></defs>
<rect width="100%" height="100%" rx="20" fill="#f6f8fb"/>
<g font-family="DejaVu Sans, Arial, sans-serif"><text x="34" y="43" font-size="17" font-weight="700" fill="#536173">ДОКУМЕНТ → ОСНОВАНИЯ → ОТВЕТ</text><rect x="34" y="70" width="322" height="180" rx="16" fill="#ffffff" stroke="#d8e1eb"/><text x="56" y="106" font-size="18" font-weight="700" fill="#147d86">01</text><text x="56" y="147" font-size="24" font-weight="700" fill="#253449">Ваш документ</text><text x="56" y="184" font-size="18" font-weight="400" fill="#536173">Текст договора,</text><text x="56" y="211" font-size="18" font-weight="400" fill="#536173">регламента или инструкции</text><rect x="391" y="70" width="322" height="180" rx="16" fill="#ffffff" stroke="#d8e1eb"/><text x="413" y="106" font-size="18" font-weight="700" fill="#147d86">02</text><text x="413" y="147" font-size="24" font-weight="700" fill="#253449">Найденный текст</text><text x="413" y="184" font-size="18" font-weight="400" fill="#536173">Поиск по смыслу и словам,</text><text x="413" y="211" font-size="18" font-weight="400" fill="#536173">повторное ранжирование</text><rect x="748" y="70" width="322" height="180" rx="16" fill="#ffffff" stroke="#d8e1eb"/><text x="770" y="106" font-size="18" font-weight="700" fill="#147d86">03</text><text x="770" y="147" font-size="24" font-weight="700" fill="#253449">Ответ с источником</text><text x="770" y="184" font-size="18" font-weight="400" fill="#536173">Исходная цитата,</text><text x="770" y="211" font-size="18" font-weight="400" fill="#536173">страница и координаты</text><path d="M363,160 L381,160" stroke="#8392a4" stroke-width="2.4" marker-end="url(#arrow)" fill="none"/><path d="M720,160 L738,160" stroke="#8392a4" stroke-width="2.4" marker-end="url(#arrow)" fill="none"/><text x="34" y="291" font-size="21" font-weight="400" fill="#253449">Не хватает нужных сведений? Предусмотрен отказ, а не ответ по памяти.</text></g></svg>
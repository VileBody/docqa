<svg xmlns="http://www.w3.org/2000/svg" width="1104" height="692" viewBox="0 0 1104 692" role="img" aria-labelledby="title desc">
<title id="title">Архитектура DocQA</title><desc id="desc">Фоновая индексация и независимый маршрут поиска, ранжирования и ответа.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8392a4"/></marker></defs>
<rect width="100%" height="100%" rx="20" fill="#f6f8fb"/>
<g font-family="DejaVu Sans, Arial, sans-serif"><text x="32" y="47" font-size="32" font-weight="700" fill="#253449">Один сервис. Два маршрута.</text><rect x="22" y="75" width="1060" height="240" rx="16" fill="#eef3f8" stroke="#eef3f8"/><text x="43" y="109" font-size="17" font-weight="700" fill="#536173">01   ПОДГОТОВКА ДОКУМЕНТА — В ФОНЕ</text><rect x="43" y="130" width="223" height="141" rx="16" fill="#ffffff" stroke="#d8e1eb"/><text x="58" y="165" font-size="23" font-weight="700" fill="#253449">Загрузка TXT</text><text x="58" y="204" font-size="16" font-weight="400" fill="#536173">API принимает файл</text><text x="58" y="230" font-size="16" font-weight="400" fill="#536173">и возвращает ID задачи</text><rect x="308" y="130" width="223" height="141" rx="16" fill="#ffffff" stroke="#d8e1eb"/><text x="323" y="165" font-size="23" font-weight="700" fill="#253449">Celery</text><text x="323" y="204" font-size="16" font-weight="400" fill="#536173">Индексация в фоне</text><text x="323" y="230" font-size="16" font-weight="400" fill="#536173">Redis: очередь, статус</text><rect x="573" y="130" width="223" height="141" rx="16" fill="#ffffff" stroke="#d8e1eb"/><text x="588" y="165" font-size="23" font-weight="700" fill="#253449">Два вектора</text><text x="588" y="204" font-size="16" font-weight="400" fill="#536173">Qwen: векторы смысла</text><text x="588" y="230" font-size="16" font-weight="400" fill="#536173">BM25: поиск по словам</text><rect x="838" y="130" width="223" height="141" rx="16" fill="#ffffff" stroke="#d8e1eb"/><text x="853" y="165" font-size="23" font-weight="700" fill="#253449">Qdrant</text><text x="853" y="204" font-size="16" font-weight="400" fill="#536173">Текст + два вектора</text><text x="853" y="230" font-size="16" font-weight="400" fill="#536173">Готовый индекс</text><path d="M276,197 L299,197" stroke="#8392a4" stroke-width="2.4" marker-end="url(#arrow)" fill="none"/><path d="M541,197 L564,197" stroke="#8392a4" stroke-width="2.4" marker-end="url(#arrow)" fill="none"/><path d="M806,197 L829,197" stroke="#8392a4" stroke-width="2.4" marker-end="url(#arrow)" fill="none"/><text x="43" y="298" font-size="19" font-weight="400" fill="#253449">До завершения индексации документ недоступен для вопросов.</text><rect x="22" y="340" width="1060" height="280" rx="16" fill="#eef5f5" stroke="#eef5f5"/><text x="43" y="377" font-size="17" font-weight="700" fill="#536173">02   ПОИСК И ОТВЕТ — ДЛЯ КАЖДОГО ВОПРОСА</text><rect x="43" y="400" width="223" height="141" rx="16" fill="#ffffff" stroke="#d8e1eb"/><text x="58" y="435" font-size="20" font-weight="700" fill="#253449">Вопрос + документ</text><text x="58" y="474" font-size="16" font-weight="400" fill="#536173">Выбранный документ</text><text x="58" y="500" font-size="16" font-weight="400" fill="#536173">Без прошлого диалога</text><rect x="308" y="400" width="223" height="141" rx="16" fill="#ffffff" stroke="#d8e1eb"/><text x="323" y="435" font-size="20" font-weight="700" fill="#253449">Поиск в Qdrant</text><text x="323" y="474" font-size="16" font-weight="400" fill="#536173">Смысл + BM25</text><text x="323" y="500" font-size="16" font-weight="400" fill="#536173">Объединение выдач</text><rect x="573" y="400" width="223" height="141" rx="16" fill="#ffffff" stroke="#d8e1eb"/><text x="588" y="435" font-size="20" font-weight="700" fill="#253449">Qwen reranker</text><text x="588" y="474" font-size="16" font-weight="400" fill="#536173">Оценка кандидатов</text><text x="588" y="500" font-size="16" font-weight="400" fill="#536173">Отбирает контекст</text><rect x="838" y="400" width="223" height="141" rx="16" fill="#ffffff" stroke="#d8e1eb"/><text x="853" y="435" font-size="20" font-weight="700" fill="#253449">Sol + проверка</text><text x="853" y="474" font-size="16" font-weight="400" fill="#536173">Модель пишет ответ</text><text x="853" y="500" font-size="16" font-weight="400" fill="#536173">Код проверяет цитаты</text><path d="M276,467 L299,467" stroke="#8392a4" stroke-width="2.4" marker-end="url(#arrow)" fill="none"/><path d="M541,467 L564,467" stroke="#8392a4" stroke-width="2.4" marker-end="url(#arrow)" fill="none"/><path d="M806,467 L829,467" stroke="#8392a4" stroke-width="2.4" marker-end="url(#arrow)" fill="none"/><text x="43" y="577" font-size="19" font-weight="400" fill="#536173">Генератор видит только отобранные источники.</text><text x="43" y="605" font-size="19" font-weight="400" fill="#536173">На выходе — ответ с цитатами или сообщение о недостатке сведений.</text><text x="32" y="659" font-size="19" font-weight="400" fill="#253449">Qwen ищет и ранжирует. Sol формулирует. Приложение проверяет происхождение.</text></g></svg>